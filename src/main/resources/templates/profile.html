<!DOCTYPE html>
<html lang="en" class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>User Profile</title>

    <link rel="stylesheet"
          th:href="@{/css/profile.css}"
          href="/css/profile.css">
</head>

<body class="d-flex flex-column min-vh-100" th:attr="data-open-tab=${openTab}">
<header th:replace="~{fragments/nav.html :: nav}"></header>

<main class="profile-page flex-grow-1">

    <div class="container">

        <div class="profile-card">

            <button class="profile-edit-btn"
                    type="button"
                    data-bs-toggle="modal"
                    data-bs-target="#miModal">
                Edit
            </button>

            <div class="profile-avatar-wrap">
                <img class="profile-avatar"
                     th:src="@{'/user/' + ${user.id} + '/pic'}"
                     alt="User Avatar">
            </div>

            <h1 class="profile-name"
                th:text="${user.username}">
                Username
            </h1>

            <div class="profile-points-box">
                <span>Total Points</span>
                <strong th:text="${user.totalPoints}">0</strong>
            </div>

            <div class="profile-actions">

                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="profile-logout-btn">
                        Log Out
                    </button>
                </form>

                <form th:action="@{'/user/' + ${user.id} + '/delete'}"
                      method="post"
                      onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <button type="submit"
                            class="profile-delete-btn">
                        Delete Account
                    </button>

                </form>

            </div>

        </div>

<div class="profile-card game-history-card mt-4">
    <h2 class="profile-name mb-4">
        Game History
    </h2>

    <div class="table-responsive">

        <table class="table align-middle">

            <thead>
            <tr>
                <th>Game ID</th>
                <th>Questions</th>
                <th>Difficulty</th>
                <th>Score</th>
                <th>Status</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="game : ${games}">

                <td th:text="${game.id}">1</td>

                <td th:text="${game.numQuestions}">
                    10
                </td>

                <td th:text="${game.difficulty}">
                    easy
                </td>

                <td th:text="${game.score}">
                    0
                </td>

                <td th:text="${game.gameState}">
                    FINISHED
                </td>

            </tr>

            </tbody>

        </table>

    </div>

</div>

    </div>

    <!-- EDIT PROFILE MODAL -->

    <div class="modal fade" id="miModal" tabindex="-1">

        <div class="modal-dialog modal-dialog-centered">

            <div class="modal-content profile-modal">

                <div class="modal-header profile-modal-header">

                    <h5 class="modal-title">
                        Settings
                    </h5>

                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <ul class="nav nav-tabs profile-tabs mb-3" role="tablist">

                        <li class="nav-item">
                            <button class="nav-link active"
                                    data-bs-toggle="tab"
                                    data-bs-target="#picture"
                                    type="button">
                                Picture
                            </button>
                        </li>

                        <li class="nav-item">
                            <button class="nav-link"
                                    data-bs-toggle="tab"
                                    data-bs-target="#name"
                                    type="button">
                                Profile
                            </button>
                        </li>

                        <li class="nav-item">
                            <button class="nav-link"
                                    data-bs-toggle="tab"
                                    data-bs-target="#password"
                                    type="button">
                                Password
                            </button>
                        </li>

                    </ul>

                    <div class="tab-content">

                        <!-- PROFILE PICTURE -->

                        <div class="tab-pane fade show active" id="picture">

                            <form th:action="@{'/user/' + ${user.id} + '/pic'}"
                                  method="post"
                                  enctype="multipart/form-data">

                                <input type="hidden" name="formType" value="avatar">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <input type="file"
                                           name="photo"
                                           class="form-control profile-input">
                                </div>

                                <button type="submit"
                                        class="profile-save-btn">
                                    Save Picture
                                </button>

                            </form>

                        </div>

                        <!-- USERNAME + EMAIL -->

                        <div class="tab-pane fade" id="name">

                            <form th:action="@{'/user/' + ${user.id}}"
                                  method="post">

                                <input type="hidden"
                                       name="formType"
                                       value="userNameEmail">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <div class="mb-3">
                                    <label class="form-label">
                                        Username
                                    </label>

                                    <input type="text"
                                           class="form-control profile-input"
                                           name="username"
                                           th:value="${user.username}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Email
                                    </label>

                                    <input type="email"
                                           class="form-control profile-input"
                                           name="email"
                                           th:value="${user.email}">
                                </div>

                                <button type="submit"
                                        class="profile-save-btn">
                                    Save Changes
                                </button>

                            </form>

                        </div>

                        <!-- PASSWORD -->

                        <div class="tab-pane fade" id="password">

                            <form th:action="@{'/user/' + ${user.id}}"
                                  method="post">

                                <input type="hidden"
                                       th:name="${_csrf.parameterName}"
                                       th:value="${_csrf.token}" />

                                <input type="hidden"
                                       name="formType"
                                       value="password">

                                <div class="mb-3">
                                    <label class="form-label">
                                        Current Password
                                    </label>

                                    <input type="password"
                                           class="form-control profile-input"
                                           name="currentPassword"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        New Password
                                    </label>

                                    <input type="password"
                                           class="form-control profile-input"
                                           name="password"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label">
                                        Repeat New Password
                                    </label>

                                    <input type="password"
                                           class="form-control profile-input"
                                           name="pass2"
                                           required>
                                </div>

                                <div th:if="${error == 'password_mismatch'}"
                                     class="alert alert-danger">
                                    New passwords do not match.
                                </div>

                                <div th:if="${error == 'current_password_incorrect'}"
                                     class="alert alert-danger">
                                    Current password is incorrect.
                                </div>

                                <button type="submit"
                                        class="profile-save-btn">
                                    Save Password
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

                <div class="modal-footer">

                    <button class="btn btn-outline-secondary"
                            type="button"
                            data-bs-dismiss="modal">
                        Close
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>

<th:block th:replace="~{fragments/footer.html :: footer}" />

<script>
    window.addEventListener('DOMContentLoaded', function () {
        const openTab = document.body.dataset.openTab;

        if (openTab) {
            const modalEl = document.getElementById('miModal');
            const modal = new bootstrap.Modal(modalEl);
            modal.show();

            const tabTrigger = document.querySelector('[data-bs-target="#' + openTab + '"]');

            if (tabTrigger) {
                new bootstrap.Tab(tabTrigger).show();
            }
        }

        const modalEl = document.getElementById('miModal');

        modalEl.addEventListener('hidden.bs.modal', function () {
            const alerts = modalEl.querySelectorAll('.alert');
            alerts.forEach(alert => alert.remove());
        });
    });
</script>

</body>

</html>
