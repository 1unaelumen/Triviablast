<!DOCTYPE html>
<html class="h-100"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />
    <title>Log In</title>

    <link rel="stylesheet"
          th:href="@{/css/login.css}"
          href="/css/login.css">
</head>

<body class="d-flex flex-column h-100">

<header th:replace="~{fragments/nav.html :: nav}"></header>

<main class="auth-page">

    <div class="auth-shape auth-shape-1"></div>
    <div class="auth-shape auth-shape-2"></div>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-10">

                <div class="auth-container">

                    <!-- LEFT SIDE -->

                    <div class="auth-left">

                        <div class="auth-badge">
                            TRIVIA GAME
                        </div>

                        <h1 class="auth-title">
                            Trivia<span>Blast</span>
                        </h1>

                        <p class="auth-description">
                            Challenge yourself with exciting questions,
                            improve your knowledge, and enjoy a colorful
                            trivia experience.
                        </p>

                    </div>

                    <!-- RIGHT SIDE -->

                    <div class="auth-right">

                        <div class="auth-box">

                            <div th:if="${error == 'password_mismatch'}"
                                 class="alert alert-danger">
                                Passwords do not match.
                            </div>

                            <!-- LOGIN FORM -->

                            <form id="loginForm"
                                  method="post"
                                  th:action="@{/login}">

                                <h2 class="auth-form-title">
                                    Sign In
                                </h2>

                                <p th:if="${loginError}"
                                   class="text-danger text-center mb-3">
                                    Invalid username or password
                                </p>

                                <div class="mb-3">
                                    <input type="text"
                                           name="username"
                                           class="form-control auth-input"
                                           placeholder="Username"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <input type="password"
                                           name="password"
                                           class="form-control auth-input"
                                           placeholder="Password"
                                           required>
                                </div>

                                <button class="auth-btn"
                                        type="submit">
                                    Sign In
                                </button>

                                <div class="auth-switch">
                                    Don't have an account?

                                    <a href="#"
                                       onclick="toggleForms(); return false;">
                                        Create Account
                                    </a>
                                </div>

                            </form>

                            <!-- REGISTER FORM -->

                            <form id="registerForm"
                                  method="post"
                                  th:action="@{/user/register}"
                                  style="display: none;">

                                <h2 class="auth-form-title">
                                    Create Account
                                </h2>

                                <div class="mb-3">
                                    <input type="text"
                                           name="username"
                                           class="form-control auth-input"
                                           placeholder="Username"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <input type="email"
                                           name="email"
                                           class="form-control auth-input"
                                           placeholder="Email"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <input type="password"
                                           name="password"
                                           class="form-control auth-input"
                                           placeholder="Password"
                                           required>
                                </div>

                                <div class="mb-3">
                                    <input type="password"
                                           name="pass2"
                                           class="form-control auth-input"
                                           placeholder="Repeat Password"
                                           required>
                                </div>

                                <button class="auth-btn"
                                        type="submit">
                                    Create Account
                                </button>

                                <div class="auth-switch">
                                    Already have an account?

                                    <a href="#"
                                       onclick="toggleForms(); return false;">
                                        Sign In
                                    </a>
                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<th:block th:replace="~{fragments/footer.html :: footer}" />

</body>
</html>
