<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>TriviaBlast</title>

    <th:block th:fragment="header">

        <meta charset="utf-8">

        <meta name="viewport"
              content="width=device-width, initial-scale=1">

        <meta name="theme-color"
              content="#0d6efd">

        <meta name="description"
              content="TriviaBlast - Online multiplayer and singleplayer trivia game">

        <!-- FONTS -->

        <link rel="preconnect"
              href="https://fonts.googleapis.com">

        <link rel="preconnect"
              href="https://fonts.gstatic.com"
              crossorigin>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
              rel="stylesheet">

       <!-- CSS -->

      <link rel="stylesheet"
      th:href="@{/css/bootstrap-5.3.3.css}"
      href="/css/bootstrap-5.3.3.css"
      type="text/css" />

      <link rel="stylesheet"
      th:href="@{/css/global.css}"
      href="/css/global.css"
      type="text/css" />

      <link rel="stylesheet"
      th:href="@{/css/nav.css}"
      href="/css/nav.css"
      type="text/css" />

      <link rel="stylesheet"
      th:href="@{/css/footer.css}"
      href="/css/footer.css"
      type="text/css" />

        <!-- FAVICON -->

        <link rel="icon"
              th:href="@{/img/favicon.png}"
              href="/img/favicon.png"
              type="image/x-icon">

        <!-- CONFIG -->

      <script type="text/javascript">

            const config = {

                socketUrl: "[[${ws}?:'']]",

                rootUrl: "[[${url}?:'']]",

                csrf: {
                    header: "[[${_csrf.headerName}]]",
                    name: "[[${_csrf.parameterName}]]",
                    value: "[[${_csrf.token}]]"
                },

                admin: "[[${u != null && u.hasRole('ADMIN')} ? true : false]]",

                userId: +"[[${u != null} ? ${u.id} : -1]]",

                topics: "[[${topics}?:'']]",
            };

            config.admin = config.admin == "true";

        </script>
    </th:block>

</head>

<body>
    Head fragment - intentionally empty.
</body>

</html>
