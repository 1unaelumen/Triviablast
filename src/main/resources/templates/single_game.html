<!DOCTYPE html>
<html lang="en" class="h-100" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}"></th:block>
    <title>TriviaBlast - Single Player</title>

    <link rel="stylesheet"
          th:href="@{/css/game.css}"
          href="/css/game.css">
</head>

<body class="d-flex flex-column h-100">

<header th:replace="~{fragments/nav.html :: nav}"></header>

<main class="game-page flex-grow-1">

    <section class="container game-section">

        <div class="game-card">

            <div class="game-topbar">
                <a href="/" class="game-exit-btn">
                    Exit Game
                </a>

                <div id="gameStatus" class="game-status">
                    0/0 0 points
                </div>
            </div>

            <div class="game-badge">
                QUESTION
            </div>

            <div id="question" class="game-question">
                Loading question...
            </div>

            <div id="answers" class="game-answers">
                <!-- Buttons inserted by JS -->
            </div>

            <div id="feedback" class="game-feedback"></div>

            <div id="nextContainer" class="game-next-container">
                <button id="nextBtn"
                        class="game-next-btn"
                        disabled>
                    Next Question
                </button>
            </div>

        </div>

    </section>

</main>

<th:block th:replace="~{fragments/footer.html :: footer}"></th:block>

<script th:inline="javascript">
    window.questions = /*[[${questions}]]*/ [];
</script>

</body>
</html>
