<!DOCTYPE html>
<html lang="en"
      class="h-100"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{fragments/head :: header}" />

    <title>Singleplayer Game Setup</title>

    <link rel="stylesheet"
          th:href="@{/css/simple-datatables-10.css}"
          href="/css/simple-datatables-10.css"
          type="text/css" />

    <link rel="stylesheet"
          th:href="@{/css/setup.css}"
          href="/css/setup.css">
</head>

<body class="h-100">

<header th:replace="~{fragments/nav.html :: nav}"></header>

<main class="setup-page">

    <div class="setup-shape setup-shape-1"></div>
    <div class="setup-shape setup-shape-2"></div>

    <div class="container">

        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-7 col-xl-5">

                <div class="setup-card">

                    <div class="setup-badge">
                        SINGLEPLAYER MODE
                    </div>

                    <h1 class="setup-title">
                        Game Setup
                    </h1>

                    <p class="setup-subtitle">
                        Customize your trivia challenge and start playing.
                    </p>

                    <form th:action="@{/game/start_single_game}"
                          method="post">

                        <!-- CATEGORY -->

                        <div class="setup-group">

                            <label class="setup-label">
                                Category
                            </label>

                            <select class="form-select setup-select"
                                    name="category">

                                <option value="" selected>
                                    Any Category
                                </option>

                                <option value="9">
                                    General Knowledge
                                </option>

                                <option value="10">
                                    Entertainment: Books
                                </option>

                                <option value="11">
                                    Entertainment: Film
                                </option>

                                <option value="12">
                                    Entertainment: Music
                                </option>

                                <option value="13">
                                    Entertainment: Musicals & Theatres
                                </option>

                                <option value="14">
                                    Entertainment: Television
                                </option>

                                <option value="15">
                                    Entertainment: Video Games
                                </option>

                                <option value="16">
                                    Entertainment: Board Games
                                </option>

                                <option value="17">
                                    Science & Nature
                                </option>

                                <option value="18">
                                    Science: Computers
                                </option>

                                <option value="19">
                                    Science: Mathematics
                                </option>

                                <option value="20">
                                    Mythology
                                </option>

                                <option value="21">
                                    Sports
                                </option>

                                <option value="22">
                                    Geography
                                </option>

                                <option value="23">
                                    History
                                </option>

                                <option value="24">
                                    Politics
                                </option>

                                <option value="25">
                                    Art
                                </option>

                                <option value="26">
                                    Celebrities
                                </option>

                                <option value="27">
                                    Animals
                                </option>

                                <option value="28">
                                    Vehicles
                                </option>

                                <option value="29">
                                    Entertainment: Comics
                                </option>

                                <option value="30">
                                    Science: Gadgets
                                </option>

                                <option value="31">
                                    Entertainment: Japanese Anime & Manga
                                </option>

                                <option value="32">
                                    Entertainment: Cartoon & Animations
                                </option>

                            </select>

                        </div>

                        <!-- DIFFICULTY -->

                        <div class="setup-group">

                            <label class="setup-label">
                                Difficulty
                            </label>

                            <select class="form-select setup-select"
                                    name="difficulty">

                                <option value="easy" selected>
                                    Easy
                                </option>

                                <option value="medium">
                                    Medium
                                </option>

                                <option value="hard">
                                    Hard
                                </option>

                            </select>

                        </div>

                        <!-- QUESTION COUNT -->

                        <div class="setup-group">

                            <label class="setup-label">
                                Number of Questions
                            </label>

                            <select class="form-select setup-select"
                                    name="questionCount">

                                <option value="5" selected>
                                    5 Questions
                                </option>

                                <option value="10">
                                    10 Questions
                                </option>

                                <option value="15">
                                    15 Questions
                                </option>

                                <option value="20">
                                    20 Questions
                                </option>

                            </select>

                        </div>

                        <button type="submit"
                                class="setup-btn">
                            Start Game
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</main>

<th:block th:replace="~{fragments/footer.html :: footer}" />

</body>
</html>
